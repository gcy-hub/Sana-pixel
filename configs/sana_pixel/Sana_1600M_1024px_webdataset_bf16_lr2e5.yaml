## SANA-1.5 1.6B / 1024px latent-to-pixel transfer on 10K prompts x 2 variants (20K images).
##
## Derived from configs/sana1-5_config/1024ms/Sana_1600M_1024px_allqknorm_bf16_lr2e5.yaml
## (the same config that generated the dataset, see metadata.json -> generation.config_sha256)
## Before training, create model.load_from with tools/convert_sana_to_pixel.py.
work_dir: output/sana_pixel_1024_10k
data:
  data_dir: [/home/ganchangyi/dataset/SANA-Pixel-Dataset/webdataset]
  data_space: pixel
  image_size: 1024
  caption_proportion:
    prompt: 1
  external_caption_suffixes: []
  external_clipscore_suffixes: []
  # no *_clip_score.json sidecars exist, so pick the caption by proportion
  caption_selection_type: proportion
  clip_thr_temperature: 0.1
  clip_thr: 25.0
  del_img_clip_thr: 22.0
  load_text_feat: false
  # Pixel mode requires RGB images. This flag retains its original meaning and
  # must not be used as a pixel/latent mode switch.
  load_vae_feat: false
  transform: default_train
  type: SanaWebDatasetMS
  sort_dataset: false
# model config
model:
  model: SanaMSPixel_1600M_P32_D20
  image_size: 1024
  mixed_precision: bf16
  fp32_attention: true
  load_from: /home/ganchangyi/huggingface_ckpts/SANA1.5_1.6B_1024px_pixel_init/checkpoints/SANA1.5_1.6B_1024px_pixel_init.pth
  resume_from:
  aspect_ratio_type: ASPECT_RATIO_1024
  multi_scale: true
  attn_type: linear
  ffn_type: glumbconv
  mlp_acts:
    - silu
    - silu
    -
  mlp_ratio: 2.5
  use_pe: false
  qk_norm: true
  cross_norm: true
  class_dropout_prob: 0.1
  l2p_first_trainable_blocks: 5
  l2p_last_trainable_blocks: 5
# Kept for SanaConfig compatibility; pixel mode never constructs or calls this VAE.
vae:
  vae_type: AutoencoderDC
  vae_pretrained: mit-han-lab/dc-ae-f32c32-sana-1.1-diffusers
  scale_factor: 0.41407
  vae_latent_dim: 32
  vae_downsample_rate: 32
  sample_posterior: true
# text encoder
text_encoder:
  text_encoder_name: /home/ganchangyi/huggingface_ckpts/gemma-2-2b-it
  y_norm: true
  y_norm_scale_factor: 0.01
  model_max_length: 300
  # CHI
  chi_prompt:
    - 'Given a user prompt, generate an "Enhanced prompt" that provides detailed visual descriptions suitable for image generation. Evaluate the level of detail in the user prompt:'
    - '- If the prompt is simple, focus on adding specifics about colors, shapes, sizes, textures, and spatial relationships to create vivid and concrete scenes.'
    - '- If the prompt is already detailed, refine and enhance the existing details slightly without overcomplicating.'
    - 'Here are examples of how to transform or refine prompts:'
    - '- User Prompt: A cat sleeping -> Enhanced: A small, fluffy white cat curled up in a round shape, sleeping peacefully on a warm sunny windowsill, surrounded by pots of blooming red flowers.'
    - '- User Prompt: A busy city street -> Enhanced: A bustling city street scene at dusk, featuring glowing street lamps, a diverse crowd of people in colorful clothing, and a double-decker bus passing by towering glass skyscrapers.'
    - 'Please generate only the enhanced description for the prompt below and avoid including any additional commentary or evaluations:'
    - 'User Prompt: '
# Sana schedule Flow
scheduler:
  predict_flow_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  flow_shift: 3.0
  # logit-normal timestep
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_dpm-solver
# training setting
train:
  num_workers: 10
  seed: 1
  train_batch_size: 4
  # Four A40 workers with batch=1 give global batch=4. One 20K-image epoch
  # is exactly 5K optimizer updates.
  num_epochs: 100
  gradient_accumulation_steps: 4
  grad_checkpointing: true
  gradient_clip: 1.0
  optimizer:
    betas:
      - 0.9
      - 0.999
    eps: 1.0e-8
    lr: 5.0e-5
    type: AdamW
    weight_decay: 0.01
    paramwise_cfg:
      bias_decay_mult: 0.0
      norm_decay_mult: 0.0
  auto_lr:
  load_from_optimizer: false
  load_from_lr_scheduler: false
  resume_lr_scheduler: false
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 1000
  local_save_vis: true # if save log image locally
  visualize: true
  eval_sampling_steps: 500
  log_interval: 20
  save_model_epochs: 1
  save_model_steps: 10000
  online_metric: false
  eval_metric_step: 2000
  online_metric_dir: metric_helper
  
